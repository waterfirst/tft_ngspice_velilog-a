  <text x="24" y="912" font-size="14" fill="#0f172a">PMOS는 게이트가 낮을 때 켜진다. 초기화 동안 T8이 T1 소스를 VOBS로 올려 T1 vsg ≈ VOBS − VINIT = <tspan font-weight="700">8.5 V</tspan> → 직전 계조와 무관한 바이어스를 한 번 건다.</text>
