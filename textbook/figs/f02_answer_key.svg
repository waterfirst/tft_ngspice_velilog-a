<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="820" height="340" rx="14" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#0f172a">정답지가 있는 모의고사</text>

  <rect x="20" y="64" width="780" height="104" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 5"/>
  <text x="36" y="88" font-size="14" fill="#475569">출제자 (학생에게 숨김)</text>
  <g font-size="15" text-anchor="middle" fill="#0f172a">
    <rect x="40" y="100" width="210" height="54" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="145" y="124" font-weight="700">정답 모델 ptft_true</text><text x="145" y="144" font-size="14" fill="#475569">로그 열화 · 식이 더 복잡</text>
    <rect x="300" y="100" width="210" height="54" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="405" y="124" font-weight="700">"측정" I–V</text><text x="405" y="144" font-size="14" fill="#475569">+3% 잡음, +5 fA 잡음</text>
    <rect x="560" y="100" width="220" height="54" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="670" y="124" font-weight="700">정답 전류</text><text x="670" y="144" font-size="14" fill="#475569">정답 모델로 돌린 화소</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#ar)"><line x1="250" y1="127" x2="296" y2="127"/></g>

  <text x="36" y="206" font-size="14" fill="#475569">학생 (우리 파이프라인)</text>
  <g font-size="15" text-anchor="middle" fill="#0f172a">
    <rect x="300" y="220" width="210" height="54" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="405" y="244" font-weight="700">피팅 모델 ptft_fit</text><text x="405" y="264" font-size="14" fill="#475569">stretched exp · 단순한 식</text>
    <rect x="560" y="220" width="220" height="54" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="670" y="244" font-weight="700">예측 전류</text><text x="670" y="264" font-size="14" fill="#475569">추출 카드로 돌린 화소</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#ar)">
    <line x1="405" y1="154" x2="405" y2="216"/><line x1="510" y1="247" x2="556" y2="247"/>
  </g>
  <line x1="670" y1="154" x2="670" y2="216" stroke="#16a34a" stroke-width="3" stroke-dasharray="4 4"/>
  <text x="682" y="192" font-size="15" fill="#16a34a" font-weight="700">채점: 오차 %</text>
  <text x="24" y="318" font-size="14" fill="#475569">두 모델을 일부러 다르게 만든다. 같으면 정답을 베끼는 셈이라 오차가 0으로 나온다.</text>
</svg>
