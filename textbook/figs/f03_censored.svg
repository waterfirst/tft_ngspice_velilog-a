<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="820" height="390" rx="14" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#0f172a">측정 바닥 아래 점: 버리면 안 되고 "상한"으로 남긴다</text>

  <!-- left panel -->
  <g transform="translate(30,60)">
    <text x="0" y="16" font-size="16" font-weight="700" fill="#dc2626">버림 (v1)</text>
    <line x1="30" y1="250" x2="350" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="30" y1="40" x2="30" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="190" y="276" font-size="14" fill="#475569" text-anchor="middle">|Vgs| →</text>
    <text x="10" y="150" font-size="14" fill="#475569" transform="rotate(-90 10 150)" text-anchor="middle">log Id</text>
    <line x1="30" y1="200" x2="350" y2="200" stroke="#475569" stroke-dasharray="6 5"/>
    <text x="346" y="194" font-size="14" fill="#475569" text-anchor="end">측정 바닥 15 fA</text>
    <g fill="#2563eb"><circle cx="230" cy="150" r="5"/><circle cx="260" cy="110" r="5"/><circle cx="290" cy="80" r="5"/><circle cx="320" cy="62" r="5"/></g>
    <g fill="none" stroke="#cbd5e1" stroke-width="2"><circle cx="80" cy="222" r="5"/><circle cx="120" cy="230" r="5"/><circle cx="160" cy="218" r="5"/><circle cx="200" cy="208" r="5"/></g>
    <path d="M40,120 C140,122 200,130 230,150 C255,120 290,80 330,60" fill="none" stroke="#dc2626" stroke-width="3"/>
    <text x="50" y="108" font-size="15" fill="#dc2626" font-weight="700">누설이 pA급으로 뜬다</text>
  </g>

  <!-- right panel -->
  <g transform="translate(440,60)">
    <text x="0" y="16" font-size="16" font-weight="700" fill="#16a34a">상한 처리 (v2)</text>
    <line x1="30" y1="250" x2="350" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="30" y1="40" x2="30" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="190" y="276" font-size="14" fill="#475569" text-anchor="middle">|Vgs| →</text>
    <line x1="30" y1="200" x2="350" y2="200" stroke="#475569" stroke-dasharray="6 5"/>
    <text x="346" y="194" font-size="14" fill="#475569" text-anchor="end">측정 바닥 15 fA</text>
    <g fill="#2563eb"><circle cx="230" cy="150" r="5"/><circle cx="260" cy="110" r="5"/><circle cx="290" cy="80" r="5"/><circle cx="320" cy="62" r="5"/></g>
    <g stroke="#2563eb" stroke-width="2.5" fill="#2563eb">
      <line x1="80" y1="200" x2="80" y2="228"/><path d="M74,224 L80,236 L86,224 z"/>
      <line x1="120" y1="200" x2="120" y2="228"/><path d="M114,224 L120,236 L126,224 z"/>
      <line x1="160" y1="200" x2="160" y2="228"/><path d="M154,224 L160,236 L166,224 z"/>
      <line x1="200" y1="200" x2="200" y2="228"/><path d="M194,224 L200,236 L206,224 z"/>
    </g>
    <path d="M40,242 C140,240 200,190 230,150 C255,120 290,80 330,60" fill="none" stroke="#16a34a" stroke-width="3"/>
    <text x="54" y="120" font-size="15" fill="#16a34a" font-weight="700">"이보다 작다"만 벌점</text>
  </g>
  <text x="24" y="376" font-size="14" fill="#475569">0h 화소 전류 오차 저계조 +627% → −9%. 단, v1→v2에서 T3·T4 IGZO 전환도 함께 바뀌었다</text>
</svg>
