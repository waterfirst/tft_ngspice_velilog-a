<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
  </defs>
  <rect width="820" height="400" rx="14" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#0f172a">소자 측정에서 화소 전류까지: 다섯 칸</text>

  <g font-size="15" fill="#0f172a" text-anchor="middle">
    <rect x="20" y="80" width="138" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="89" y="112" font-weight="700">① 측정 I–V</text><text x="89" y="136">TFT별 × 시간별</text><text x="89" y="158" fill="#475569" font-size="14">CSV</text>

    <rect x="182" y="80" width="138" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="251" y="112" font-weight="700">② 모델카드</text><text x="251" y="136">Vth, μ, SS, Ioff</text><text x="251" y="158" fill="#475569" font-size="14">Verilog-A 파라미터</text>

    <rect x="344" y="80" width="138" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="413" y="112" font-weight="700">③ 열화식</text><text x="413" y="136">ΔVth(t), μ(t)</text><text x="413" y="158" fill="#475569" font-size="14">미래 시간 외삽</text>

    <rect x="506" y="80" width="138" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="575" y="112" font-weight="700">④ 화소 회로</text><text x="575" y="136">6T1C / 8T1C</text><text x="575" y="158" fill="#475569" font-size="14">ngspice 과도해석</text>

    <rect x="668" y="80" width="132" height="92" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <text x="734" y="112" font-weight="700">⑤ 애노드 전류</text><text x="734" y="136">I(t)</text><text x="734" y="158" fill="#475569" font-size="14">시간별 예측</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#ar)">
    <line x1="158" y1="126" x2="178" y2="126"/><line x1="320" y1="126" x2="340" y2="126"/>
    <line x1="482" y1="126" x2="502" y2="126"/><line x1="644" y1="126" x2="664" y2="126"/>
  </g>
  <text x="120" y="206" font-size="14" fill="#2563eb">파란 칸 = 물리 모델이 하는 일 (기존 흐름)</text>

  <path d="M89,172 C89,300 700,300 734,176" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arO)"/>
  <rect x="300" y="246" width="220" height="46" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="410" y="275" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="700">AI 단독: I–V → 전류 직행</text>

  <rect x="560" y="320" width="240" height="60" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="680" y="345" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="700">Hybrid: ④의 답 + AI 보정</text>
  <text x="680" y="367" font-size="14" text-anchor="middle" fill="#475569">AI는 잔차만 배운다</text>
  <line x1="700" y1="320" x2="720" y2="180" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arO)"/>
  <text x="24" y="376" font-size="14" fill="#ea580c">주황 = AI가 끼어드는 자리</text>
</svg>
